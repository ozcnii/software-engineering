30.0 350,1346.0" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/><polyline points="260.0,404.0 40,404.0 40,1539.0 55.0,1539.0" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/><polyline points="350,1564.0 350,1598.0" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/><polyline points="160,1564.0 160,1580.0 350,1580.0" fill="none" stroke="#333333" stroke-width="2"/><text x="358" y="471.0" fill="#333333" font-size="13">да</text><text x="44" y="398.0" fill="#333333" font-size="13">нет</text><text x="358" y="693.0" fill="#333333" font-size="13">нет</text><text x="184.0" y="614.0" fill="#333333" font-size="13">да</text><text x="358" y="831.0" fill="#333333" font-size="13">да</text><text x="496.0" y="752.0" fill="#333333" font-size="13">нет</text><text x="358" y="1041.0" fill="#333333" font-size="13">нет</text><text x="456.0" y="968.0" fill="#333333" font-size="13">да</text><rect x="290.0" y="28.0" width="120" height="44" rx="22.0" ry="22.0" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="50.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Начало</tspan></text><polygon points="201.0,106.0 515.0,106.0 499.0,156.0 185.0,156.0" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="123.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Ввести сетку лабиринта,</tspan><tspan x="350" dy="16">клетку входа и клетку выхода</tspan></text><rect x="185.0" y="190.0" width="330" height="50" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="207.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Положить клетку входа в очередь</tspan><tspan x="350" dy="16">и в множество посещённых</tspan></text><rect x="245.0" y="274.0" width="210" height="50" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="291.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Создать пустую</tspan><tspan x="350" dy="16">карту предков</tspan></text><polygon points="350,358.0 440.0,404.0 350,450.0 260.0,404.0" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="396.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Очередь</tspan><tspan x="350" dy="16">не пуста?</tspan></text><rect x="235.0" y="484.0" width="230" height="50" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="501.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Извлечь клетку</tspan><tspan x="350" dy="16">из начала очереди</tspan></text><polygon points="350,568.0 490.0,620.0 350,672.0 210.0,620.0" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="612.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Извлечённая клетка</tspan><tspan x="350" dy="16">совпадает с выходом?</tspan></text><polygon points="350,706.0 490.0,758.0 350,810.0 210.0,758.0" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="750.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Остались необработанные</tspan><tspan x="350" dy="16">соседи?</tspan></text><rect x="230.0" y="844.0" width="240" height="50" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="861.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Взять очередного</tspan><tspan x="350" dy="16">проходимого соседа</tspan></text><polygon points="350,928.0 450.0,974.0 350,1020.0 250.0,974.0" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="966.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Сосед уже</tspan><tspan x="350" dy="16">посещён?</tspan></text><rect x="225.0" y="1054.0" width="250" height="50" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="1071.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Добавить соседа в</tspan><tspan x="350" dy="16">множество посещённых</tspan></text><rect x="225.0" y="1138.0" width="250" height="50" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="1155.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Записать текущую клетку</tspan><tspan x="350" dy="16">как предка соседа</tspan></text><rect x="240.0" y="1222.0" width="220" height="50" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="1239.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Положить соседа</tspan><tspan x="350" dy="16">в конец очереди</tspan></text><rect x="200.0" y="1346.0" width="300" height="50" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="1363.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Восстановить путь по карте</tspan><tspan x="350" dy="16">предков от выхода ко входу</tspan></text><rect x="235.0" y="1430.0" width="230" height="50" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="1447.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Инвертировать</tspan><tspan x="350" dy="16">последовательность</tspan></text><polygon points="286.0,1514.0 430.0,1514.0 414.0,1564.0 270.0,1564.0" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="1539.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Вернуть путь</tspan></text><rect x="290.0" y="1598.0" width="120" height="44" rx="22.0" ry="22.0" fill="white" stroke="#333333" stroke-width="2"/><text x="350" y="1620.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="350" dy="0">Конец</tspan></text><polygon points="71.0,1514.0 265.0,1514.0 249.0,1564.0 55.0,1564.0" fill="white" stroke="#333333" stroke-width="2"/><text x="160" y="1531.0" text-anchor="middle" dominant-baseline="central" fill="#333333"><tspan x="160" dy="0">Вернуть признак</tspan><tspan x="160" dy="16">отсутствия пути</tspan></text></svg>